name: Deploy to InfinityFree

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via FTP
        run: |
          lftp -e "
          set ftp:passive-mode yes;
          set ftp:ssl-allow no;
          mirror --reverse --verbose --delete \
            --exclude .git/ \
            --exclude uploads/ \
            --exclude logs/ \
            --exclude .github/ \
            --exclude config/ \
            --exclude .htaccess \
            ./ /;
          quit" -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" ftpupload.net
