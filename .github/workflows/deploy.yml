name: Deploy to InfinityFree

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "set ftp:passive-mode yes" > /tmp/lftp_cmds.txt
          echo "set ftp:ssl-allow no" >> /tmp/lftp_cmds.txt
          echo "mirror --reverse --verbose --delete --exclude .git/ --exclude uploads/ --exclude logs/ --exclude .github/ --exclude config/ --exclude .htaccess ./ /" >> /tmp/lftp_cmds.txt
          echo "quit" >> /tmp/lftp_cmds.txt
          lftp -f /tmp/lftp_cmds.txt -u "$FTP_USER","$FTP_PASS" ftpupload.net
